<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaveri — Gamified Finland Relocation Quests</title>
  <meta name="description" content="A gamified, AI-assisted relocation quest board for people moving from India to Finland.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button class="brand" type="button" data-action="go-home" aria-label="Go to homepage">🇫🇮 Kaveri</button>
    <div class="topbar-actions">
      <button class="link-btn" type="button" data-action="open-fun-fact">🎉 Fun Fact</button>
      <button class="link-btn" type="button" data-action="open-resources">📚 Resources</button>
    </div>
  </header>
  <div id="app"></div>

  <div class="settings-modal" id="fun-fact-modal" hidden>
    <div class="settings-box">
      <h3>🎉 Fun Fact About Finland</h3>
      <p class="muted" id="fun-fact-text"></p>
      <div class="wizard-nav">
        <button type="button" class="btn btn-ghost" data-action="close-fun-fact">Close</button>
        <button type="button" class="btn btn-primary" data-action="next-fun-fact">Another one →</button>
      </div>
    </div>
  </div>

  <div class="settings-modal" id="resources-modal" hidden>
    <div class="settings-box resources-box">
      <h3>📚 Resources</h3>
      <p class="muted">A directory of real, verified websites for relocating from India to Finland.</p>
      <div id="resources-list" class="resources-list"></div>
      <div class="wizard-nav">
        <button type="button" class="btn btn-ghost" data-action="close-resources">Close</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
